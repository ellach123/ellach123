<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <path id="pin" d="M0 0 C-12 -14 -15 -21 -15 -28 A15 15 0 0 1 15 -28 C15 -21 12 -14 0 0Z"/>
    <style>
      .drop { animation: drop 4s ease-in-out infinite; }
      .d2 { animation-delay: -0.8s; } .d3 { animation-delay: -1.6s; } .d4 { animation-delay: -2.4s; } .d5 { animation-delay: -3.2s; }
      @keyframes drop { 0%,100% { transform: translateY(0); } 15% { transform: translateY(-12px); } 30% { transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="270" rx="24" fill="#F5F8FC"/>

  <g transform="translate(-80 0)">
