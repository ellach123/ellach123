  <g class="drop d2"><use href="#pin" x="335" y="102" fill="#2BB3A3"/><circle cx="335" cy="74" r="5" fill="#fff"/></g>
  <g class="drop d3"><use href="#pin" x="310" y="186" fill="#F2B84B"/><circle cx="310" cy="158" r="5" fill="#fff"/></g>
  <g class="drop d4"><use href="#pin" x="410" y="160" fill="#F28B6B"/><circle cx="410" cy="132" r="5" fill="#fff"/></g>
  <g class="drop d5"><use href="#pin" x="465" y="116" fill="#9B8AD9"/><circle cx="465" cy="88" r="5" fill="#fff"/></g>
  </g>

  <text x="560" y="80" font-size="36" font-weight="600" fill="#1F3A5F">europe-expo-compass</text>
