  <use href="#note" fill="#5FAF62"><animateMotion dur="5s" repeatCount="indefinite" begin="-4.5s"><mpath href="#b2"/></animateMotion></use>
  <use href="#note" fill="#E0A030"><animateMotion dur="5s" repeatCount="indefinite" begin="-0.5s"><mpath href="#b3"/></animateMotion></use>
  <use href="#note8" fill="#E0A030"><animateMotion dur="5s" repeatCount="indefinite" begin="-3s"><mpath href="#b3"/></animateMotion></use>
