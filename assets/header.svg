      <rect x="5" y="-26" width="2" height="26"/>
    </g>
    <g id="note8">
      <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-20)"/>
      <rect x="5" y="-26" width="2" height="26"/>
      <path d="M7 -26 q 10 6 6 16 q 0 -8 -6 -10z"/>
    </g>
    <style>
      .spin { animation: spin 16s linear infinite; }
      @keyframes spin { from { transform: translateX(-120px); } to { transform: translateX(0); } }
      .float { animation: float 7s ease-in-out infinite; }
      .f2 { animation-delay: -2.3s; } .f3 { animation-delay: -4.6s; }
      @keyframes float { 0% { transform: translateY(20px); opacity: 0; } 30%,70% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 4s ease-in-out infinite; }
      .g2 { animation-delay: -1s; } .g3 { animation-delay: -2s; } .g4 { animation-delay: -3s; }
      @keyframes grow { 0%,100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
    </style>
  </defs>

  <rect y="80" width="1200" height="300" rx="24" fill="#F5F8FC"/>


  <g class="float"><use href="#note8" x="930" y="170" fill="#9B8AD9"/></g>
